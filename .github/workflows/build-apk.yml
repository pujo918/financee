name: Build Android APK & Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Make Gradle Executable & Accept SDK Licenses
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (www folder)
        run: node build-assets.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle.log

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Tracker-App-with-Widget
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
