name: Build Android APK & Widget

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Make Gradle Executable & Accept SDK Licenses
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (www folder)
        run: node build-assets.js

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Tracker-App-with-Widget
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
